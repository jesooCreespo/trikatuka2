<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Trikatuka moves playlists, liked songs, albums, artists and podcasts from one Spotify account to another."
    />
    <meta name="theme-color" content="#14201a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Trikatuka – migration tool for Spotify</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var pref = JSON.parse(localStorage.getItem('trikatuka:theme') || '{}').state?.preference
        var dark =
          pref === 'dark' ||
          ((!pref || pref === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
